# One-off repair of the eod2-data mirror: EOD2's daily CSVs had rows appended without a trailing newline
# (fused lines) and re-appended on reruns, which crashes pandas on the 28-Sep-2026 AASTHA bonus adjustment.
# The laptop copy was repaired with scripts/repair_eod2_csvs.py on 2026-10-17; this applies the same repair
# to the mirror's own data, so nothing is copied out of C:\dev\eod2.
#
# Manual trigger only (works from the GitHub mobile app: market-data -> Actions -> Run workflow).
# Needs the DATA_MIRROR_PAT secret with contents:read/write on eod2-data. Set push=false for a dry run
# that repairs on the runner and reports the numbers but pushes nothing.
name: "Repair eod2-data mirror (one-off)"

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the repair commit to eod2-data (false = report only)"
        type: boolean
        default: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout market-data (repair script)
        uses: actions/checkout@v4
        with:
          path: market-data

      - name: Checkout eod2-data mirror
        uses: actions/checkout@v4
        with:
          repository: Amit-Alphasetup/eod2-data
          token: ${{ secrets.DATA_MIRROR_PAT }}
          path: eod2-data-mirror
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install pandas

      - name: Dry run (numbers only)
        run: python market-data/scripts/repair_eod2_csvs.py eod2-data-mirror dry 2026-09-27

      - name: Apply repair
        run: python market-data/scripts/repair_eod2_csvs.py eod2-data-mirror apply 2026-09-27 | tee repair.out

      - name: Safety checks (refuse to push if anything looks off)
        run: |
          python - <<'EOF'
          import ast, glob, sys
          import pandas as pd
          out = open('repair.out').read().splitlines()
          stats = ast.literal_eval(out[0])
          if stats.get('conflicting_dupes', 0) != 0:
              sys.exit("conflicting duplicate rows found - not pushing")
          # Verified by a read-only dry run on the 2026-09-23 seed: 466 files / 466 fused lines / 0 conflicts.
          # (The laptop needed 3576 because failed runs kept appending rows after the mirror was seeded.)
          if not 400 <= stats.get('files_changed', 0) <= 600:
              sys.exit(f"{stats.get('files_changed', 0)} files changed, expected ~466 - not pushing")
          bad = []
          for f in glob.glob('eod2-data-mirror/daily/*.csv'):
              try:
                  pd.read_csv(f)
              except Exception as e:
                  bad.append((f, str(e)[:80]))
          if bad:
              sys.exit(f"{len(bad)} CSVs still unreadable, e.g. {bad[:3]} - not pushing")
          print("OK: stats", stats, "- every daily CSV parses")
          EOF

      - name: Commit and push to eod2-data
        if: ${{ inputs.push }}
        working-directory: eod2-data-mirror
        run: |
          git config user.name "Amit-Alphasetup"
          git config user.email "apdash95@gmail.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "fix: repair fused/duplicated rows in daily CSVs (rows after 2026-09-27 dropped)"
          git push origin HEAD:main
          git log --oneline -1
